# Render Blueprint — Naajah API (free plan). The web app is hosted on Netlify.
services:
  - type: web
    name: naajah-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --include=dev && npm -w packages/shared run build && npm -w apps/api run prisma:generate && npm -w apps/api run build
    # Free plan has no pre-deploy step: apply migrations and the (idempotent) seed on boot.
    startCommand: npm -w apps/api run prisma:deploy && npm -w apps/api run prisma:seed && npm -w apps/api run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        value: https://naajah.netlify.app
      - key: WEB_URL
        value: https://naajah.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: SEED_WHATSAPP_NUMBER
        sync: false
